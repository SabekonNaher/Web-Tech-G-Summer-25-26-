 <!DOCTYPE html>
 
<html>
 
<head>
 
    <title>Position Example</title>
 
    <style>
 
        #container
 
        {
            width: 270px;
 
            height: 180px;
 
            border: 5px solid black;
 
            position: relative;
        }
 
        #boxA
 
        {
            width: 40px;
 
            height: 40px;
 
            border: 5px solid black;
 
            position: absolute;
 
            top: 20px;
 
            left: 20px;
 
        }
 
        #boxB
 
        {
            width: 40px;
 
            height: 40px;
 
            border: 5px solid black;
 
            position: absolute;
 
            top: 60px;
 
            left: 80px;
 
        }

        #boxC
 
        {
 
            width: 40px;
 
            height: 40px;
 
            border: 5px solid black;
 
            position: absolute;
 
            bottom: 30px;
 
            right: 80px;
 
        }

        #boxD
 
        {
 
            width: 40px;
 
            height: 40px;
 
            border: 5px solid black;
 
            position: absolute;
 
            top: 0px;
 
            right: 0px;
 
            visibility: hidden;
 
        }
    </style>
</head>
<body>
    <div id="container">

        <div id="boxA">A</div>

        <div id="boxB">B</div>
 
        <div id="boxC">C</div>

        <div id="boxD">D</div>
 
    </div>
</body>
 
</html>
