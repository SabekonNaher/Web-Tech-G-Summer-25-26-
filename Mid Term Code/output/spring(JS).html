<!DOCTYPE html>
<html>
<head>
    <title>Console Output Question</title>
</head>
<body>
 
<button onclick="process()">Click Me</button>
 
<script>
let data = [];
let value = 1; 
 
function process() {
    if (value <= 3) {
        data[data.length] = value * 2;
        console.log("Added:", value * 2);
    } else {
        let last = data[data.length - 1];
        data.length = data.length - 1;
        console.log("Removed:", last);
    }
 
    value++;
 
    for (let i = 0; i < data.length; i++) {
        console.log("Current:", data[i]);
    }
}
</script>
 
</body>
</html>
