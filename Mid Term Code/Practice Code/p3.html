<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Course Feedback</title>

    <style>
    
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
        }

        /* Box Model */
        form{
            max-width: 500px;
            margin: auto;
            border: 2px solid #bdbdbd;
            padding: 20px;
            background-color: white;
        }

        /* Class Selector */
        .label{
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        /* Descendant Combinator */
        form input,
        form select,
        form textarea,
        form button{
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #999;
        }

        textarea{
            resize: vertical;
            height: 100px;
        }

        button[type="submit"]{
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 15px;    
        }

        /* Hover Effect */
        button[type="submit"]:hover{
            background-color: #0066cc;
        }

        /* Floating Help Button */
        .help-btn{
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: white;
            border: 1px solid #444;
            cursor: pointer;
            box-shadow: 2px 2px 6px gray;
        }

        .help-btn:hover{
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

    <header>
        <h1>Course Feedback — Summer 2025–26</h1>
    </header>

    <main>
        <form>

            <label class="label" for="course">Course Name</label>
            <input type="text" id="course" name="course">

            <label class="label" for="studentid">Student ID</label>
            <input type="text" id="studentid" name="studentid">

            <label class="label" for="rating">Overall Rating</label>
            <select id="rating" name="rating">
                <option>Excellent</option>
                <option>Good</option>
                <option>Average</option>
                <option>Poor</option>
            </select>

            <label class="label" for="comments">Comments</label>
            <textarea id="comments" name="comments"></textarea>

            <button type="submit">Submit Feedback</button>

        </form>
    </main>

    <button class="help-btn">? Help</button>

</body>
</html>
