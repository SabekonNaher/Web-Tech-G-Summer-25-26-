<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard Sidebar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            height: 100vh;
            padding-top: 20px;
        }

        .menu-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            transition: 0.3s;
        }

        .menu-item:hover {
            background: #34495e;
        }

        .highlight {
            background: #27ae60;
            font-weight: bold;
        }

        .content {
            padding: 20px;
            flex: 1;
        }

        h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
</div>

<div class="content">
    <h2>Personalized Patient Management Portal</h2>
    <p>Click the sidebar menu items. Frequently used items automatically move to the top and are highlighted.</p>
</div>

<script src="script.js"></script>

</body>
</html>
